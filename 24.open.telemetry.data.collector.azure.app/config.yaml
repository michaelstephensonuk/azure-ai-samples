# Same collector config as sample 20, packaged into a container image instead of
# installed as a Windows service. The Application Insights connection string is
# injected via an environment variable backed by an Azure Container Apps secret.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Collect the collector's own metrics
  prometheus:
    config:
      scrape_configs:
      - job_name: 'otel-collector'
        scrape_interval: 10s
        static_configs:
        - targets: ['127.0.0.1:8888']

processors:
  batch:

exporters:
  azuremonitor:
    connection_string: "${env:APPINSIGHTS_CONNECTION_STRING}"
    maxbatchsize: 1024
    maxbatchinterval: 10s
    spaneventsenabled: false

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
                without_scope_info: true
                without_type_suffix: true
                without_units: true
                with_resource_constant_labels:
                  included: [ ]

  pipelines:

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [azuremonitor]

    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [azuremonitor]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [azuremonitor]
